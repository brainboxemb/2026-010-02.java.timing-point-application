# VC-ST1-007: 9 contains TimingNodes A and B.
# {NodeId} is expanded by the application to select distinct LogBooks.
timingSystems:
  - id: 9
    timingNodes:
      - id: A
      - id: B

io:
  storage:
    timingData:
      path: node-{NodeId}-logbook.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: @SHELL_PORT@
  api:
    http:
      bindAddress: 127.0.0.1
      port: @HTTP_PORT@
    webSocket:
      bindAddress: 127.0.0.1
      port: @WEB_SOCKET_PORT@

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
