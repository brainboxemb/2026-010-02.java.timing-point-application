# Single TimingNode fixture for VC-ST1-001 through VC-ST1-006.
# @NODE_ID@ and @..._PORT@ are replaced by test factory.
timingSystems:
  - systemId: @NODE_ID@
    timingNodes:
      - nodeId: @NODE_ID@

io:
  storage:
    timingData:
      path: node_@NODE_ID@_logbook.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: @SHELL_PORT@
  api:
    http:
      bindAddress: 127.0.0.1
      port: @HTTP_PORT@
    webSocket:
      bindAddress: 127.0.0.1
      port: @WEB_SOCKET_PORT@

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
