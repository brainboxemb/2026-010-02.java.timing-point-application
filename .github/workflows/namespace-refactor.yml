name: One-shot namespace refactor

on:
  push:
    branches:
      - refactor/issue-971-oss-relay-namespace

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'Move Java namespace to oss.relay.eventtiming') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refactor/issue-971-oss-relay-namespace
          fetch-depth: 0

      - name: Apply namespace refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          old_ns = "io.github.brainboxemb.eventtiming"
          new_ns = "oss.relay.eventtiming"
          old_path = "io/github/brainboxemb/eventtiming"
          new_path = "oss/relay/eventtiming"

          root = Path(".")
          workflow = Path(".github/workflows/namespace-refactor.yml")

          files = [
              path for path in root.rglob("*")
              if path.is_file() and ".git" not in path.parts
          ]

          for path in files:
              if path == Path("CHANGELOG.md"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old_ns in text:
                  path.write_text(text.replace(old_ns, new_ns), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = (
              "- Move the Java/Maven namespace from "
              + chr(96) + old_ns + chr(96)
              + " to " + chr(96) + new_ns + chr(96)
              + ", including source packages, reactor coordinates, launch "
                "configuration and service/resource names."
          )
          if entry not in text:
              marker = "## Unreleased"
              if marker in text:
                  text = text.replace(marker, marker + "\n\n" + entry, 1)
              else:
                  text = marker + "\n\n" + entry + "\n\n" + text
              changelog.write_text(text, encoding="utf-8")

          files = [
              path for path in root.rglob("*")
              if path.is_file() and ".git" not in path.parts
          ]
          moves = []
          for path in files:
              raw = path.as_posix()
              target = raw.replace(old_path, new_path).replace(old_ns, new_ns)
              if target != raw:
                  moves.append((path, Path(target)))

          # Move deepest paths first; each target is unique.
          for source, target in sorted(moves, key=lambda item: len(item[0].parts), reverse=True):
              if not source.exists():
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              os.replace(str(source), str(target))

          # The helper workflow must not remain in the resulting source tree.
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "brainboxemb"
          git config user.email "285184499+brainboxemb@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Move Java namespace to oss.relay.eventtiming"
          git push origin HEAD:refactor/issue-971-oss-relay-namespace
