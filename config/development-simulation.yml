# Development configuration for the built-in simulated-tag scenario path.
#
# On Windows the current development platform fallback composes SimulatedAntenna 1.
# The simulated antenna (with a single system/node and nonempty EventData) makes
# TAG_SCENARIO_SIMULATION available. Selecting the simulation EventData provider
# gives a finite 2000-team dataset but is not required to enable the capability.
parameters:
  ID: A

timingSystems:
  - systemId: "{ID}"
    eventDataProvider: simulation
    timingDataProvider: reference

    timingNodes:
      - nodeId: "{ID}"

        tagProcessing:
          quietTimeoutMillis: 250
          maxBurstDurationMillis: 1000
          duplicateWindowMillis: 15000
          sweepCadenceMillis: 50
          observationQueueCapacity: 256

io:
  storage:
    timingData:
      path: data/development-simulation-node-{NodeId}-logbook.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: 8023
  api:
    http:
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      bindAddress: 127.0.0.1
      port: 8082

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
  live:
    bindAddress: 127.0.0.1
    port: 8030
