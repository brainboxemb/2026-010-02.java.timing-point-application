# Development configuration for the built-in simulated-tag scenario path.
#
# On Windows the current development platform fallback composes SimulatedAntenna 1.
# The antenna, supported topology and nonempty EventData determine
# TAG_SCENARIO_SIMULATION, not the EventData provider.
# This profile uses the SAME reference EventData as the normal configuration;
# the isolated LogBook lets engineers run experiments without changing normal data.
parameters:
  ID: A

timingSystems:
  - systemId: "{ID}"
    eventDataProvider: reference
    timingDataProvider: reference

    timingNodes:
      - nodeId: "{ID}"

        tagProcessing:
          quietTimeoutMillis: 250
          maxBurstDurationMillis: 1000
          duplicateWindowMillis: 15000
          sweepCadenceMillis: 50
          observationQueueCapacity: 256

upstream:
  # Development simulation uses the same Engineering upstream transport.
  transport: engineering-api
  # Optional pacing between successive TIMING_DATA replay packets; 0 disables it.
  timingDataReplayPacketDelayMillis: 0

io:
  storage:
    timingData:
      path: data/development-simulation-node-{NodeId}-logbook.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: 8023
  api:
    http:
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      bindAddress: 127.0.0.1
      port: 8082

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
  live:
    bindAddress: 127.0.0.1
    port: 8030
