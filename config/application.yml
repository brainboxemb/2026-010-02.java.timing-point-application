# Complete example configuration for one TimingNode and its external interfaces.
parameters:
  # Deployment-local source constant; resolved before effective configuration.
  ID: A

timingSystems:
  - timingSystemId: SID-{ID}

    # Built-in public/reference provider selections.
    eventDataProvider: reference
    timingDataProvider: reference

    timingNodes:
      - timingNodeId: "{ID}"

        # Optional TimingNode-local TagProcessor startup policy.
        # These values match the compiled defaults and may be omitted individually.
        tagProcessing:
          quietTimeoutMillis: 250
          maxBurstDurationMillis: 1000
          duplicateWindowMillis: 15000
          sweepCadenceMillis: 50
          observationQueueCapacity: 256

io:
  storage:
    timingData:
      # Context placeholders resolve once per configured TimingNode.
      path: data/node-{NodeId}-logbook.jsonl

presentation:
  remoteShell:
    # Safe example baseline: explicit loopback-only listener.
    bindAddress: 127.0.0.1
    port: 8023
  api:
    http:
      # IF-03 request/response example: loopback-only.
      bindAddress: 127.0.0.1
      port: 8081
    webSocket:
      # IF-03 live event example: separate loopback-only listener.
      bindAddress: 127.0.0.1
      port: 8082

logging:
  # Cross-cutting A08 runtime logging baseline.
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
  live:
    # Engineering/test client connects to this dedicated diagnostics listener.
    bindAddress: 127.0.0.1
    port: 8030
