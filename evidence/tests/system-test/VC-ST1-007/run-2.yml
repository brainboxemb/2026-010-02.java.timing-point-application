# VC-ST1-007: 9 contains TimingNodes A and B.
# {NodeId} is expanded by the application to select distinct LogBooks.
timingSystems:
  - systemId: 9
    timingNodes:
      - nodeId: A
      - nodeId: B

io:
  storage:
    timingData:
      path: node-{NodeId}-logbook.jsonl

presentation:
  remoteShell:
    bindAddress: 127.0.0.1
    port: 41951
  api:
    http:
      bindAddress: 127.0.0.1
      port: 35351
    webSocket:
      bindAddress: 127.0.0.1
      port: 37521

logging:
  level: INFO
  file:
    path: logs
    rotateBytes: 1048576
    retainedFiles: 5
